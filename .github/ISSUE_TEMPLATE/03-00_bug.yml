
name: "バグ報告"
description: "不具合の報告・調査・修正"
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        ## 作業定義・確認事項
        発生した不具合の調査・修正を行います。
        担当・レビュー担当はアサイン情報を参照してください。
        作業時期は関連Issue・PRの進捗に応じて調整してください。

  - type: textarea
    id: why
    attributes:
      label: "Why / なぜ"
      description: "不具合による影響・修正が必要な理由"
      placeholder: "不具合の影響や問題点を記述してください。"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: "What / 何を"
      description: "不具合が発生している機能・画面・ファイル"
      placeholder: "対象となる機能やファイルを記述してください。"
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: "Where / どこで"
      description: "対象ブランチ"
      value: "`feature/xxx`"
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: "How / どうやって"
      description: "調査・修正方法（未確定の場合は仮説でも可）"
      placeholder: "想定される原因や修正方針を記述してください。"

  - type: textarea
    id: reproduction
    attributes:
      label: "再現手順"
      description: "不具合を再現するための具体的な操作"
      placeholder: |
        1. アプリを起動する
        2. 対象画面を開く
        3. 特定の操作を行う
        4. 不具合が発生する
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "期待する動作"
      description: "本来どのように動作するべきか"
      placeholder: "正常な場合の動作を記述してください。"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "実際の動作"
      description: "現在発生している不具合の内容"
      placeholder: "実際に発生した現象を記述してください。"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: "対象プラットフォーム"
      description: "不具合が発生する環境"
      multiple: true
      options:
        - iOS
        - iPadOS
        - watchOS
        - macOS
        - Mac Catalyst
        - その他
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "実行環境"
      description: "端末・OS・アプリバージョンなど"
      placeholder: |
        - 端末：
        - OSバージョン：
        - アプリバージョン：
        - ビルド番号：
        - その他：
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: "再現頻度"
      description: "不具合が発生する頻度"
      options:
        - 常に発生する
        - 高頻度で発生する
        - まれに発生する
        - 一度だけ発生した
        - 未確認

  - type: textarea
    id: logs
    attributes:
      label: "ログ・スクリーンショット"
      description: "エラーログ・画像・動画など"
      placeholder: "関連するログやスクリーンショットを添付してください。"
      render: ""
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: "完了要件"
      description: "不具合修正完了と判断するための条件"
      value: |
        - [ ] 不具合の再現条件を特定する
        - [ ] 原因を調査・特定する
        - [ ] 修正方針を決定する
        - [ ] 不具合を修正する
        - [ ] 修正後に同じ手順で再現しないことを確認する
        - [ ] 関連機能への影響・回帰を確認する
        - [ ] 必要に応じてテストを追加・更新する
        - [ ] 対象環境で動作を検証する
        - [ ] PRを作成する（PR番号：{PR番号を記述}）
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: "備考"
      description: "関連Issue・PR・参考資料など"
      placeholder: "補足情報があれば記述してください。"
